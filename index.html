<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Snake Frog Blast</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(#78d6fa,#b6edaa);color:#183c29;text-align:center}main{max-width:470px;margin:auto;padding:12px}h1{font-size:29px;color:#176b37;text-shadow:1px 2px #fff;margin:10px}header{display:flex;justify-content:space-around;background:#fff9d9;border:3px solid #c6a46a;border-radius:17px;padding:10px;font-weight:800}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:16px auto;padding:6px;background:#3f7043;border-radius:14px}.tile{aspect-ratio:1;border:2px solid #ffffff70;border-radius:12px;display:grid;place-items:center;font-size:clamp(22px,7vw,39px);background:#f2f8dd;touch-action:manipulation;position:relative}.tile.sel{outline:4px solid #ffe052;background:#fff0a1}.tile.snake{background:#b4ff8a}.tile span{position:absolute;bottom:0;right:3px;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}.controls{display:flex;gap:8px;justify-content:center}button{font-size:17px;font-weight:800;border:0;border-radius:14px;padding:13px;background:#31b94b;color:white;box-shadow:0 4px #14772a}button:disabled{opacity:.5}#msg{min-height:42px;font-weight:700;padding:8px}small{display:block;margin-top:8px}</style><main><h1>🐍 SNAKE FROG BLAST 🐸</h1><header><div>🎯 Hedef<br><span id="goal">0/20</span></div><div>Hamle<br><span id="moves">25</span></div><div>Puan<br><span id="score">0</span></div></header><div id="board" class="board"></div><div id="msg">Yılanın yanındaki aynı renk kurbağalara dokun!</div><div class="controls"><button id="eat">🐍 Yedir</button><button id="reset">↻ Yeniden</button></div><small>3+ kurbağa: puan · 5+: bomba · 6+: renkli top</small></main><script>const N=6,colors=['🔴','🔵','🟡','🟢','🟣'];let grid,pos,path,moves,score,eaten,ended;const $=x=>document.getElementById(x),adj=(a,b)=>Math.abs(Math.floor(a/N)-Math.floor(b/N))+Math.abs(a%N-b%N)===1;function start(){grid=Array.from({length:N*N},()=>Math.floor(Math.random()*5));pos=14;path=[];moves=25;score=0;eaten=0;ended=false;msg('Yılanın yanındaki aynı renk kurbağalara dokun!');draw()}function msg(s){$('msg').textContent=s}function draw(){$('board').innerHTML='';grid.forEach((v,i)=>{let d=document.createElement('div');d.className='tile'+(path.includes(i)?' sel':'')+(i===pos?' snake':'');d.innerHTML=i===pos?'🐍':v===null?'': '🐸<span>'+colors[v]+'</span>';d.onclick=()=>pick(i);$('board').appendChild(d)});$('moves').textContent=moves;$('score').textContent=score;$('goal').textContent=Math.min(eaten,20)+'/20';$('eat').disabled=!path.length||ended}function pick(i){if(ended||i===pos)return;if(path.length&&i===path[path.length-1]){path.pop();draw();return}let prev=path.length?path[path.length-1]:pos;if(!adj(prev,i)||path.includes(i)||grid[i]===null){msg('Yan yana olan kurbağaları seç.');return}if(path.length&&grid[i]!==grid[path[0]]){msg('Aynı renkteki kurbağaları seç!');return}path.push(i);msg(path.length+' kurbağa seçildi');draw()}function eat(){if(ended||!path.length)return;let count=path.length,kind=grid[path[0]];path.forEach(i=>grid[i]=null);pos=path[path.length-1];grid[pos]=null;path=[];moves--;eaten+=count;score+=count*100+(count>=5?300:0)+(count>=6?500:0);if(count>=6){grid.forEach((v,i)=>{if(i!==pos&&v===kind){grid[i]=null;eaten++;score+=100}});msg('🌈 Renkli top! Aynı renk temizlendi!')}else if(count>=5){let r=Math.floor(pos/N),c=pos%N;for(let y=Math.max(0,r-1);y<=Math.min(N-1,r+1);y++)for(let x=Math.max(0,c-1);x<=Math.min(N-1,c+1);x++){let i=y*N+x;if(i!==pos&&grid[i]!==null){grid[i]=null;eaten++;score+=100}}msg('💣 Bomba!')}else msg(count>=3?'Harika eşleşme!':'Yılan kurbağayı yedi!');grid=grid.map((v,i)=>i===pos?null:v===null?Math.floor(Math.random()*5):v);if(eaten>=20){ended=true;msg('🏆 Kazandın! '+score+' puan!')}else if(!moves){ended=true;msg('Hamle bitti! Yeniden dene.')}draw()}$('eat').onclick=eat;$('reset').onclick=start;start();</script></html>
