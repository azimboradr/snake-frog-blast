<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#267d57"><title>Snake Frog Blast</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}body{color:#204329;background:radial-gradient(circle at 85% 7%,#e9fff0 0,transparent 27%),linear-gradient(160deg,#5ac9d8 0%,#8ce3b4 38%,#286f4b 100%)}.app{max-width:520px;min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 13px) 12px 22px;position:relative;overflow:hidden}.app:before,.app:after{content:"🌿 🍃 🌸";position:absolute;opacity:.4;pointer-events:none;font-size:40px}.app:before{top:10%;left:-20px;transform:rotate(-20deg)}.app:after{bottom:5%;right:-20px}h1{font-size:clamp(25px,7vw,37px);text-align:center;color:#fff6c7;text-shadow:0 3px 0 #256d39,0 5px 12px #16452d;margin:4px 0 13px;letter-spacing:.3px}.hud{display:grid;grid-template-columns:1.25fr .85fr .85fr;gap:7px}.stat{background:linear-gradient(#fff8dc,#ffe7b0);border:3px solid #d1a96b;border-radius:17px;box-shadow:0 4px 0 #926f3d;padding:8px 3px;text-align:center}.stat b{display:block;font-size:12px;color:#6b583d}.stat strong{display:block;font-size:25px;color:#174b38}.boardWrap{margin-top:19px;background:#326a45;border:6px solid #376a3f;border-radius:22px;padding:5px;box-shadow:0 10px 0 #225134,0 18px 26px #123b2755}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.cell{aspect-ratio:1;min-width:0;border:0;border-radius:12px;position:relative;background:linear-gradient(145deg,#e6f6c7,#b5d99b);box-shadow:inset 0 -3px #6a9d68;display:grid;place-items:center;padding:0;transition:transform .13s,background .13s;overflow:hidden}.cell:nth-child(even){background:linear-gradient(145deg,#ddf2bb,#b2d59a)}.cell:active{transform:scale(.9)}.cell.active{outline:3px solid #fff09a;z-index:2;background:#fdf1a7}.cell.reachable{box-shadow:inset 0 0 0 3px #fff6b5,inset 0 -3px #6a9d68}.frog{width:85%;height:85%;filter:drop-shadow(0 3px 1px #244d2b55)}.snakeHead{font-size:clamp(25px,7vw,43px);filter:drop-shadow(0 3px 1px #286137);position:relative;z-index:2;animation:bob .6s infinite alternate}.tail{position:absolute;inset:18%;background:repeating-linear-gradient(35deg,#65d840 0 10px,#329b35 10px 17px);border:3px solid #247e2b;border-radius:45%;opacity:.9}@keyframes bob{to{transform:translateY(-3px)}}.status{background:#fff9dfdd;border-radius:14px;min-height:51px;margin:17px 0 9px;padding:11px;text-align:center;font-weight:750;font-size:14px;box-shadow:0 3px 8px #2a643e33}.actions{display:flex;gap:8px;justify-content:center}.actions button{border:0;background:linear-gradient(#3fd66a,#169d45);color:white;border-radius:14px;font-weight:800;font-size:15px;padding:11px 17px;box-shadow:0 4px #0c6b33}.actions button.secondary{background:linear-gradient(#fff6c9,#e4c789);color:#4c6134;box-shadow:0 4px #9b8a5c}.hint{font-size:12px;text-align:center;color:#faffdf;margin-top:12px;text-shadow:0 1px 2px #145b37}.overlay{position:fixed;inset:0;background:#0e3529b9;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.overlay.show{display:flex}.modal{width:min(350px,100%);background:#fff5ce;border:5px solid #d9ad6c;border-radius:25px;text-align:center;padding:25px;box-shadow:0 12px 30px #0005}.modal h2{font-size:29px;margin:5px}.modal button{border:0;border-radius:14px;background:#20b94e;color:white;font-size:20px;font-weight:800;padding:13px 30px}
</style></head><body><main class="app"><h1>🐍 SNAKE FROG BLAST</h1><div class="hud"><div class="stat"><b>🎯 HEDEF</b><strong id="goal">0 / 25</strong></div><div class="stat"><b>HAMLE</b><strong id="moves">25</strong></div><div class="stat"><b>⭐ PUAN</b><strong id="score">0</strong></div></div><section class="boardWrap"><div class="board" id="board"></div></section><div class="status" id="status">Yılanın yanındaki kurbağaya dokun!</div><div class="actions"><button class="secondary" id="help">❔ Nasıl oynanır?</button><button id="restart">↻ Yeniden</button></div><div class="hint">🐸 Aynı renkten 3+ eşleştir · 5 = 💣 · 6 = 🌈</div></main><div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalButton">Tamam</button></div></div>
<script>
(function(){
const N=6, C=['#f25b64','#4d9df5','#ffcd4a','#a65be9','#56ca68'];let cells,head,trail,chain,chainColor,moves,score,total,finished,busy;
const el=id=>document.getElementById(id),near=(a,b)=>Math.abs((a/6|0)-(b/6|0))+Math.abs(a%6-b%6)===1;
function frog(color){return '<svg class="frog" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="80" rx="36" ry="9" fill="#244c34" opacity=".18"/><ellipse cx="50" cy="55" rx="38" ry="31" fill="'+color+'" stroke="#326b48" stroke-width="3"/><circle cx="27" cy="30" r="16" fill="'+color+'" stroke="#326b48" stroke-width="3"/><circle cx="73" cy="30" r="16" fill="'+color+'" stroke="#326b48" stroke-width="3"/><circle cx="29" cy="29" r="10" fill="#fff"/><circle cx="71" cy="29" r="10" fill="#fff"/><circle cx="32" cy="30" r="5" fill="#1b3232"/><circle cx="68" cy="30" r="5" fill="#1b3232"/><circle cx="35" cy="57" r="3" fill="#315b43"/><circle cx="65" cy="57" r="3" fill="#315b43"/><path d="M36 67 Q50 79 64 67" fill="none" stroke="#71463d" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="18" cy="64" rx="6" ry="4" fill="#fff" opacity=".2"/></svg>'}
function note(t){el('status').textContent=t}
function modal(title,desc){el('modalTitle').textContent=title;el('modalText').textContent=desc;el('overlay').classList.add('show')}
function reset(){cells=Array.from({length:36},()=>Math.random()*5|0);head=14;trail=[];chain=[];chainColor=null;moves=25;score=0;total=0;finished=false;busy=false;el('overlay').classList.remove('show');note('Yılanın yanındaki kurbağaya dokun!');render()}
function render(){el('board').innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.className='cell'+(chain.includes(i)?' active':'')+(near(head,i)&&i!==head?' reachable':'');b.setAttribute('aria-label',i===head?'Yılan':C[v]+' kurbağa');if(trail.includes(i)&&i!==head)b.innerHTML='<span class="tail"></span>';if(i===head)b.innerHTML='<span class="snakeHead">🐍</span>';else if(v!==null)b.innerHTML=frog(C[v]);b.onclick=()=>tap(i);el('board').appendChild(b)});el('moves').textContent=moves;el('score').textContent=score;el('goal').textContent=Math.min(total,25)+' / 25'}
function fill(){for(let i=0;i<36;i++)if(i!==head&&cells[i]===null)cells[i]=Math.random()*5|0}
function finishChain(){if(!chain.length)return;let len=chain.length,removed=len;score+=len*100;total+=len;if(len>=6){for(let i=0;i<36;i++)if(i!==head&&cells[i]===chainColor){cells[i]=null;removed++;score+=100;total++}note('🌈 Renkli top! Aynı renktekiler temizlendi!')}else if(len>=5){for(let y=Math.max(0,(head/6|0)-1);y<=Math.min(5,(head/6|0)+1);y++)for(let x=Math.max(0,head%6-1);x<=Math.min(5,head%6+1);x++){let i=y*6+x;if(i!==head&&cells[i]!==null){cells[i]=null;removed++;score+=100;total++}}note('💣 Bomba! Yakındaki kurbağalar temizlendi!')}else note(len>=3?'✨ '+len+' kurbağalık eşleşme!':'🐸 '+len+' kurbağa yendi!');moves--;chain=[];chainColor=null;trail=[];fill();if(total>=25){finished=true;modal('🏆 Bölüm tamam!',score+' puan topladın!')}else if(moves<=0){finished=true;modal('⏳ Hamleler bitti','Bu kez '+total+' kurbağa topladın. Tekrar dene!')}}
function tap(i){if(finished||busy||i===head)return;if(!near(head,i)){note('🐍 Yılan yalnızca yanındaki kareye ilerleyebilir.');return}let color=cells[i];if(color===null)return;if(chain.length&&color!==chainColor){finishChain();if(finished){render();return}}if(chain.length===0)chainColor=color;chain.push(i);trail.unshift(head);trail=trail.slice(0,3);head=i;cells[i]=null;note('🐍 '+chain.length+' aynı renk kurbağa! Başka renge geçince eşleşme tamamlanır.');render()}
el('restart').onclick=reset;el('help').onclick=()=>modal('🐸 Nasıl oynanır?','Yılanın hemen yanındaki kurbağaya dokun. Aynı renktekileri art arda yiyerek zincir yap. Farklı renge geçtiğinde zincir tamamlanır ve 1 hamle harcanır. 5 kurbağa bomba, 6 kurbağa renkli top etkisi yaratır. 25 kurbağa topla!');el('modalButton').onclick=()=>{el('overlay').classList.remove('show');if(finished)reset()};reset();
})();
</script></body></html>
