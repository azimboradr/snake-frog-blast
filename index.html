<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#236e4c"><title>Snake Frog Rush — Continuous Snake</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#174b3d;font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#254329}button{font:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}.app{width:min(100%,500px);height:100dvh;margin:auto;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 12%,#c4f4ff 0,#83d4e7 28%,transparent 55%),linear-gradient(155deg,#387d4e,#8ec56b 55%,#2d7956);padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column}.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}.decor:before{content:"🌿";font-size:92px;position:absolute;top:-25px;left:-25px;transform:rotate(-35deg)}.decor:after{content:"🌿";font-size:100px;position:absolute;top:-28px;right:-35px;transform:rotate(40deg)}.decor span{position:absolute;bottom:0;font-size:55px;opacity:.8}.decor span:first-child{left:-14px}.decor span:last-child{right:-15px}.screen{position:relative;z-index:1;display:flex;flex-direction:column;min-height:0;flex:1}.hidden{display:none!important}.brand{text-align:center;font-weight:1000;color:#ffc52d;-webkit-text-stroke:2px #814b20;text-shadow:0 4px #75401d,0 8px 14px #163a2c66;letter-spacing:-1px;font-size:clamp(35px,9vw,52px);line-height:1.1}.brand small{display:block;color:#1abaf8;font-size:.77em}.menuBrand{margin-top:9vh;background:linear-gradient(#9e6437,#764120);border:5px solid #684023;border-radius:24px;padding:15px 8px;box-shadow:inset 0 4px #d49a58,0 8px #51361e}.hero{font-size:clamp(130px,35vw,185px);text-align:center;flex:1;display:flex;justify-content:center;align-items:center;filter:drop-shadow(0 12px 7px #183c2c88);animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}.hero span{font-size:65px;align-self:flex-end;margin-bottom:12%}.primary{display:block;width:84%;margin:10px auto 18px;padding:14px;border:4px solid #166e2a;border-radius:23px;background:linear-gradient(#80f33e,#10a828);box-shadow:inset 0 4px #c4ff80,0 6px #0d6828;color:#fff;font-size:28px;font-weight:1000;text-shadow:0 2px #22712b}.description{text-align:center;font-weight:900;color:#fffbe6;text-shadow:0 2px #20563d;margin:4px 0 12px}.help{align-self:center;background:#f9e2ad;border:3px solid #bd935c;border-radius:14px;padding:9px 18px;color:#674b2b;font-weight:900;margin-bottom:20px}.hud{display:grid;grid-template-columns:1.1fr .85fr 1fr auto;gap:6px;align-items:stretch;margin:7px 0 10px}.stat{background:linear-gradient(#fff5d6,#f1d09a);border:3px solid #c99d66;border-radius:15px;text-align:center;padding:6px 2px;box-shadow:0 4px #9c744c}.stat label{display:block;font-size:12px;font-weight:900}.stat strong{display:block;font-size:clamp(22px,7vw,32px);color:#174e68}.stat strong.danger{color:#e04b34}.pause{border:3px solid #12558c;border-radius:13px;background:linear-gradient(#7bcfff,#1465b5);box-shadow:0 4px #0f4e86;color:white;font-size:22px;padding:0 9px}.gameTitle{text-align:center;color:#fff3b9;text-shadow:0 2px #28583c;font-weight:1000;font-size:16px}.fieldWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.field{width:100%;max-height:100%;aspect-ratio:6/8;padding:6px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:3px;background:linear-gradient(130deg,#517744,#2d5e42);border:5px solid #8c683d;border-radius:20px;box-shadow:inset 0 3px #a7b47a,0 8px #365333,0 13px 18px #173d2d77;touch-action:none;user-select:none;-webkit-user-select:none}.tile{position:relative;border:1px solid #77996d;border-radius:10px;background:radial-gradient(circle at 30% 20%,#92b778,#56835a 80%);display:grid;place-items:center;min-height:0;min-width:0;overflow:hidden;touch-action:none}.tile:nth-child(odd){background:radial-gradient(circle at 30% 20%,#84a96d,#4b7956 80%)}.tile .frogSvg{width:98%;height:98%;filter:drop-shadow(0 3px 2px #12372a77);animation:hop 1.8s ease-in-out infinite}.tile .snakeSvg{width:114%;height:114%;filter:drop-shadow(0 3px 3px #12372a88)}.tile.gold{background:radial-gradient(circle,#ffef9a,#9db75e);box-shadow:inset 0 0 0 2px #ffe47e,0 0 12px #ffe76b}.tile.gold .frogSvg{filter:drop-shadow(0 0 7px #ffe44c)}.tile.snakeTile{background:radial-gradient(circle,#b6ec83,#5b9b57)}@keyframes hop{50%{transform:translateY(-3px) scale(1.05)}}.snakeTraveler{position:fixed;pointer-events:none;z-index:50;transition:transform .14s linear}.snakeTraveler .snakeSvg{width:100%;height:100%}.message{text-align:center;min-height:43px;margin:14px 0 2px;font-weight:900;color:#fff7d4;text-shadow:0 2px 2px #24543b;font-size:15px}.instruction{text-align:center;color:#f6ffe8;font-size:12px;font-weight:800;margin-bottom:4px}.overlay{position:absolute;inset:0;background:#0b2518b9;z-index:90;display:grid;place-items:center;padding:17px}.modal{background:linear-gradient(#fff5d5,#f2d29b);border:5px solid #ac7842;border-radius:25px;width:100%;max-width:390px;padding:18px;box-shadow:0 12px 25px #0008}.modal h2{text-align:center;background:linear-gradient(#bf7b3c,#8a4d24);color:white;border-radius:15px;padding:10px;margin:0 0 12px;font-size:26px}.modal p{text-align:center;line-height:1.55;font-weight:750}.modal .primary{font-size:21px;margin:15px auto 0}.pop{position:absolute;z-index:70;pointer-events:none;font-size:24px;animation:pop .75s ease-out forwards;text-shadow:0 2px #345}@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}@media(max-height:720px){.hud{margin:3px 0 5px}.message{margin-top:8px;min-height:31px}.gameTitle{font-size:14px}.stat{padding:3px 1px}.field{padding:4px;gap:2px}.menuBrand{margin-top:5vh}.hero{font-size:110px}}
.field{display:block;aspect-ratio:360/490;padding:0;overflow:hidden;border:5px solid #456b42;border-radius:25px;background:#4e925d;box-shadow:0 6px #315a3b,0 12px 20px #183f2d88}.fieldWrap{padding:4px 0}.tile{display:none}.instruction{font-size:12px}</style></head><body><main class="app"><div class="decor"><span>🌸🌿</span><span>🌿🌼</span></div><section id="home" class="screen"><div class="menuBrand"><div class="brand">SNAKE<small>FROG RUSH</small></div></div><div class="hero">🐍<span>🐸</span></div><div class="description">Kurbağaları kovala, altın kurbağayı yakala!</div><button class="primary" id="start">▶ Oyna</button><button class="help" id="help">📖 Nasıl oynanır?</button></section><section id="game" class="screen hidden"><div class="gameTitle">🌿 KURBAĞA AVI 🌿</div><div class="hud"><div class="stat"><label>🐸 Yakalanan</label><strong id="caught">0/15</strong></div><div class="stat"><label>⏱ Süre</label><strong id="time">60</strong></div><div class="stat"><label>⭐ Puan</label><strong id="score">0</strong></div><button class="pause" id="pause">Ⅱ</button></div><div class="fieldWrap"><div class="field" id="field"></div></div><div class="message" id="message">Yılanın üzerine basılı tutup sürükle!</div><div class="instruction">🐸 Her kurbağa 100 puan · 🌟 Altın kurbağa 500 puan</div></section><div class="overlay hidden" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><div id="modalText"></div><button class="primary" id="modalButton">Tamam</button></div></div></main><script>
const $=id=>document.getElementById(id),COL=['#f45155','#339cfa','#ffd02f','#55d94a','#a85ae5'],ROWS=8,COLS=6,SIZE=48,TARGET=15;
function frog(t){let c=COL[t];return '<svg class="frogSvg" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="frogGrad'+t+'" cx="30%" cy="18%" r="82%"><stop offset="0" stop-color="#ffffff"/><stop offset=".16" stop-color="'+c+'"/><stop offset=".74" stop-color="'+c+'"/><stop offset="1" stop-color="#2c6e48"/></radialGradient><radialGradient id="eyeGlow" cx="35%" cy="25%" r="75%"><stop stop-color="white"/><stop offset="1" stop-color="#c9e5dd"/></radialGradient></defs><ellipse cx="50" cy="90" rx="35" ry="7" fill="#173626" opacity=".3"/><path d="M17 61 Q8 83 29 86 Q50 94 72 85 Q93 81 84 60" fill="'+c+'" stroke="#27623e" stroke-width="3"/><ellipse cx="50" cy="54" rx="38" ry="31" fill="url(#frogGrad'+t+')" stroke="#27623e" stroke-width="2.5"/><circle cx="28" cy="29" r="18" fill="'+c+'" stroke="#27623e" stroke-width="2.5"/><circle cx="72" cy="29" r="18" fill="'+c+'" stroke="#27623e" stroke-width="2.5"/><ellipse cx="29" cy="28" rx="12" ry="13" fill="url(#eyeGlow)"/><ellipse cx="71" cy="28" rx="12" ry="13" fill="url(#eyeGlow)"/><circle cx="33" cy="29" r="6.2" fill="#173027"/><circle cx="67" cy="29" r="6.2" fill="#173027"/><circle cx="35" cy="26" r="2" fill="white"/><circle cx="65" cy="26" r="2" fill="white"/><ellipse cx="27" cy="57" rx="8" ry="5" fill="#ffadad" opacity=".27"/><ellipse cx="73" cy="57" rx="8" ry="5" fill="#ffadad" opacity=".27"/><circle cx="40" cy="58" r="2.2" fill="#346347"/><circle cx="60" cy="58" r="2.2" fill="#346347"/><path d="M34 66 Q50 84 66 66" stroke="#624636" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M21 43 Q24 38 28 39" stroke="white" stroke-width="3" stroke-linecap="round" opacity=".48"/></svg>'}

function snake(){return '<svg class="snakeSvg" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="headG" cx="30%" cy="20%" r="85%"><stop stop-color="#d5ff7a"/><stop offset=".45" stop-color="#74db40"/><stop offset="1" stop-color="#2b9838"/></radialGradient></defs><path d="M10 74 C18 94 68 98 68 72 S22 63 30 42 S75 56 74 31" fill="none" stroke="#257f35" stroke-width="25" stroke-linecap="round"/><path d="M10 74 C18 94 68 98 68 72 S22 63 30 42 S75 56 74 31" fill="none" stroke="#75dc3f" stroke-width="18" stroke-linecap="round"/><path d="M11 74 C23 91 68 92 68 71 S24 61 31 42" fill="none" stroke="#b3f56d" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 13" opacity=".9"/><ellipse cx="70" cy="33" rx="27" ry="25" fill="url(#headG)" stroke="#277b37" stroke-width="2.5"/><ellipse cx="59" cy="14" rx="12" ry="13" fill="#8fe74c"/><ellipse cx="82" cy="14" rx="12" ry="13" fill="#8fe74c"/><ellipse cx="60" cy="13" rx="8" ry="9" fill="white"/><ellipse cx="81" cy="13" rx="8" ry="9" fill="white"/><circle cx="63" cy="14" r="4.5" fill="#1b3326"/><circle cx="78" cy="14" r="4.5" fill="#1b3326"/><circle cx="65" cy="11" r="1.7" fill="white"/><circle cx="77" cy="11" r="1.7" fill="white"/><ellipse cx="72" cy="42" rx="18" ry="9" fill="#b9f47d"/><path d="M58 36 Q72 51 87 35" stroke="#2d6638" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M85 41 Q99 55 99 41" stroke="#f17c92" stroke-width="4" fill="none" stroke-linecap="round"/></svg>'}


const W=360,H=490,TARGET=15;
let frogs=[],snakeBody=[],head={x:180,y:250},angle=-Math.PI/2,targetAngle=-Math.PI/2,score=0,caught=0,seconds=60,playing=false,paused=false,modalFn=null,lastFrame=0,elapsed=0,hopElapsed=0,spawnElapsed=0,steer=null,raf=0,canvas=null,ctx=null,sprites=[];
const rnd=n=>Math.floor(Math.random()*n),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function setupCanvas(){const f=$('field');f.innerHTML='<canvas id="playCanvas" width="720" height="980" style="width:100%;height:100%;display:block;touch-action:none"></canvas>';canvas=$('playCanvas');ctx=canvas.getContext('2d');ctx.setTransform(2,0,0,2,0,0);canvas.addEventListener('pointerdown',e=>{if(!playing||paused)return;e.preventDefault();steer=point(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}});canvas.addEventListener('pointermove',e=>{if(!playing||paused)return;if(e.buttons||e.pointerType==='touch'){e.preventDefault();steer=point(e)}});canvas.addEventListener('pointerup',e=>{steer=null});canvas.addEventListener('pointercancel',()=>steer=null)}
function point(e){let b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H}}
function makeSprite(svg){const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);return img}
function loadSprites(){sprites=Array.from({length:6},(_,i)=>makeSprite(frog(i===5?2:i)));} 
function addFrog(gold=false){let p;for(let k=0;k<30;k++){p={x:28+Math.random()*(W-56),y:30+Math.random()*(H-60)};if(Math.hypot(p.x-head.x,p.y-head.y)>80&&frogs.every(f=>Math.hypot(f.x-p.x,f.y-p.y)>38))break}frogs.push({...p,color:gold?5:rnd(5),phase:Math.random()*6.28,hop:0,dx:0,dy:0})}
function begin(){cancelAnimationFrame(raf);head={x:W/2,y:H/2};angle=-Math.PI/2;targetAngle=angle;steer=null;snakeBody=Array.from({length:27},(_,i)=>({x:head.x,y:head.y+i*4}));frogs=[];score=0;caught=0;seconds=60;elapsed=0;hopElapsed=0;spawnElapsed=0;playing=true;paused=false;for(let i=0;i<10;i++)addFrog();addFrog(true);$('home').classList.add('hidden');$('game').classList.remove('hidden');$('overlay').classList.add('hidden');setupCanvas();loadSprites();hud();message('🐍 Yılan sürekli ilerler. Parmağınla yön ver!');lastFrame=performance.now();raf=requestAnimationFrame(loop)}
function hud(){$('caught').textContent=caught+'/'+TARGET;$('time').textContent=Math.ceil(seconds);$('score').textContent=score;$('time').classList.toggle('danger',seconds<=10)}
function message(s){$('message').textContent=s}
function loop(now){let dt=Math.min((now-lastFrame)/1000,.045);lastFrame=now;if(playing&&!paused){update(dt)}draw();raf=requestAnimationFrame(loop)}
function update(dt){elapsed+=dt;hopElapsed+=dt;spawnElapsed+=dt;seconds=Math.max(0,60-elapsed);if(seconds<=0){finish(false);return}
if(steer){let desired=Math.atan2(steer.y-head.y,steer.x-head.x);let diff=Math.atan2(Math.sin(desired-angle),Math.cos(desired-angle));angle+=clamp(diff,-3.9*dt,3.9*dt)}
let speed=113;head.x+=Math.cos(angle)*speed*dt;head.y+=Math.sin(angle)*speed*dt;
if(head.x<15){head.x=15;angle=Math.PI-angle}if(head.x>W-15){head.x=W-15;angle=Math.PI-angle}if(head.y<15){head.y=15;angle=-angle}if(head.y>H-15){head.y=H-15;angle=-angle}
snakeBody[0]={x:head.x,y:head.y};for(let i=1;i<snakeBody.length;i++){let a=snakeBody[i-1],b=snakeBody[i],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;const spacing=3.8;if(d>spacing){b.x=a.x-dx/d*spacing;b.y=a.y-dy/d*spacing}}
for(let i=frogs.length-1;i>=0;i--){let f=frogs[i];f.phase+=dt*3.1;f.hop=Math.max(0,f.hop-dt*2.8);if(Math.hypot(head.x-f.x,head.y-f.y)<23){let gold=f.color===5;frogs.splice(i,1);caught++;score+=gold?500:100;message(gold?'🌟 Altın kurbağa! +500':'🐸 Yakalandı! +100');addFrog(gold);if(caught>=TARGET){hud();finish(true);return}}}
if(hopElapsed>1.25){hopElapsed=0;for(let i=0;i<Math.min(3,frogs.length);i++){let f=frogs[rnd(frogs.length)],a=Math.atan2(f.y-head.y,f.x-head.x)+(Math.random()-.5)*1.8;f.x=clamp(f.x+Math.cos(a)*26,23,W-23);f.y=clamp(f.y+Math.sin(a)*26,23,H-23);f.hop=1}}
hud()}
function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#78a76d');g.addColorStop(.5,'#5d965f');g.addColorStop(1,'#357b59');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<110;i++){let x=(i*97+17)%W,y=(i*151+47)%H;ctx.fillStyle=i%3?'#c0d99120':'#245e4730';ctx.beginPath();ctx.ellipse(x,y,5+i%7,2+i%4,i*.8,0,Math.PI*2);ctx.fill()}
for(let i=0;i<16;i++){let x=(i*119+9)%W,y=(i*181+31)%H;ctx.fillStyle='#d1dca52e';ctx.beginPath();ctx.arc(x,y,2+i%3,0,Math.PI*2);ctx.fill()}
frogs.forEach(f=>{let bob=Math.sin(f.phase)*2-f.hop*11;ctx.fillStyle='#204d3e55';ctx.beginPath();ctx.ellipse(f.x,f.y+15,17,6,0,0,Math.PI*2);ctx.fill();if(f.color===5){ctx.fillStyle='#ffe66a66';ctx.beginPath();ctx.arc(f.x,f.y,27,0,Math.PI*2);ctx.fill()}
ctx.save();ctx.translate(f.x,f.y+bob);ctx.fillStyle=f.color===5?'#dcae19':['#b72e43','#1e6cb5','#c19a1c','#288448','#7b42b0'][f.color];for(let s of [-1,1]){ctx.beginPath();ctx.ellipse(s*16,12,9,6,s*.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*18,19,7,4,0,0,Math.PI*2);ctx.fill()}let img=sprites[f.color];if(img&&img.complete&&img.naturalWidth)ctx.drawImage(img,-22,-25,44,48);ctx.restore()});
ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#174b3477';ctx.shadowBlur=8;ctx.shadowOffsetY=4;ctx.strokeStyle='#256b36';ctx.lineWidth=26;ctx.beginPath();for(let i=snakeBody.length-1;i>=0;i--){let p=snakeBody[i];if(i===snakeBody.length-1)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle='#6ed13b';ctx.lineWidth=19;ctx.stroke();ctx.strokeStyle='#a6ef65';ctx.lineWidth=4;ctx.stroke();
ctx.save();ctx.translate(head.x,head.y);ctx.rotate(angle+Math.PI/2);ctx.fillStyle='#64c93c';ctx.strokeStyle='#246f34';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,21,23,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#a9ef69';ctx.beginPath();ctx.ellipse(0,7,15,11,0,0,Math.PI*2);ctx.fill();for(let x of [-9,9]){ctx.fillStyle='#eaffdf';ctx.beginPath();ctx.arc(x,-13,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#193c2c';ctx.beginPath();ctx.arc(x,-15,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(x-1,-17,1.5,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#2d783c';ctx.beginPath();ctx.arc(0,6,9,.12,Math.PI-.12);ctx.stroke();ctx.restore()}
function finish(win){playing=false;show(win?'🏆 Bölüm Tamam!':'⏰ Süre Bitti!','<p>'+caught+' kurbağa yakaladın.<br><strong>'+score+' puan</strong> topladın.</p>','Yeniden Oyna',begin)}
function show(title,body,button,fn){paused=true;$('modalTitle').textContent=title;$('modalText').innerHTML=body;$('modalButton').textContent=button;modalFn=fn;$('overlay').classList.remove('hidden')}
$('start').onclick=begin;$('help').onclick=()=>show('Nasıl Oynanır?','<p>🐍 Yılan durmadan ilerler.<br>👆 Parmağını oyun alanında sürükleyerek yönünü değiştir.<br>🐸 Kurbağaları yakala.<br>🌟 Altın kurbağa 500 puan verir.<br>⏱ 60 saniyede 15 kurbağa yakala!</p>','Anladım',()=>{paused=false});$('pause').onclick=()=>{if(playing)show('⏸ Duraklatıldı','<p>Devam etmek için düğmeye bas.</p>','Devam Et',()=>{paused=false})};$('modalButton').onclick=()=>{$('overlay').classList.add('hidden');const fn=modalFn;modalFn=null;if(fn)fn()};
</script></body></html>
