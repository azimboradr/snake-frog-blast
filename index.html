<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1e714a"><title>Snake Frog Blast</title><style>
*{box-sizing:border-box}body{margin:0;background:#153f34;font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#253e2b}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{width:min(100%,500px);margin:auto;min-height:100dvh;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 16%,#b6efff 0,#6ed1e8 28%,transparent 55%),linear-gradient(125deg,#247b56,#85b75b 55%,#2d7553);padding:calc(env(safe-area-inset-top) + 12px) 10px calc(env(safe-area-inset-bottom) + 12px)}.forest{position:absolute;inset:0;pointer-events:none;overflow:hidden}.forest:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(107deg,transparent 0 44px,#145b3960 45px 57px,transparent 58px 130px);opacity:.3}.leaf{position:absolute;font-size:52px;filter:drop-shadow(1px 4px 2px #2345);opacity:.85}.leaf.a{top:2%;left:-19px;transform:rotate(45deg)}.leaf.b{top:0;right:-25px;transform:rotate(-40deg)}.leaf.c{bottom:2%;left:-10px}.leaf.d{bottom:1%;right:-12px}.screen{position:relative;z-index:1}.hidden{display:none!important}.logo{font-weight:1000;text-align:center;line-height:.98;letter-spacing:-2px;font-size:clamp(45px,12vw,70px);color:#ffc82f;-webkit-text-stroke:2px #955021;text-shadow:0 4px #603919,0 8px #452f20,0 11px 16px #122d2080;transform:rotate(-2deg);margin:12vh 0 0}.logo span{display:block;color:#21bfff;font-size:.74em;letter-spacing:-1px}.logoBoard{padding:15px 8px 22px;border-radius:27px;background:linear-gradient(#9c5c2e,#713d22);border:6px solid #6b3d21;box-shadow:inset 0 6px #c18b47,0 12px 18px #1239;transform:rotate(-2deg)}.hero{height:32vh;min-height:210px;display:flex;align-items:center;justify-content:center;position:relative}.hero .big{font-size:clamp(130px,40vw,195px);filter:drop-shadow(0 14px 8px #173b2c88);animation:bob 2s ease-in-out infinite}.hero .small{position:absolute;font-size:50px;bottom:8%;right:8%;filter:drop-shadow(0 5px 4px #173b2c77)}@keyframes bob{50%{transform:translateY(-9px)}}.play{display:block;margin:10px auto;width:78%;border:4px solid #176d2b;border-radius:23px;background:linear-gradient(#80ed40,#10a824);box-shadow:inset 0 4px #c5ff72,0 7px #075c20,0 12px 17px #143e2766;color:white;font-size:30px;font-weight:1000;text-shadow:0 3px #20702b;padding:12px}.menuRow{display:flex;gap:8px;margin:25px 0}.menuRow button{flex:1;min-width:0;border:3px solid #174b80;border-radius:17px;background:linear-gradient(#58b2fa,#0e5ab5);box-shadow:inset 0 3px #b4e5ff,0 6px #153d73;color:white;font-size:13px;font-weight:900;padding:12px 3px}.menuRow span{display:block;font-size:26px}.gameTop{display:flex;gap:6px;align-items:center;margin:8px 0 12px}.wood{background:linear-gradient(#fff5d8,#f5d7a4);border:3px solid #d7a66b;box-shadow:0 4px #9c7346;border-radius:17px;text-align:center;padding:5px 3px;min-height:78px}.wood label{display:block;font-size:12px;font-weight:900;color:#473f2f}.wood strong{display:block;font-size:29px;color:#164575}.wood.goal{flex:2.05}.wood.single{flex:.85}.goalGrid{display:flex;justify-content:space-around}.goalGrid div{font-size:12px;font-weight:900}.goalGrid i{display:block;width:26px;height:24px;margin:auto}.pause{border:3px solid #134b85;border-radius:13px;background:linear-gradient(#76c9f6,#1869bd);color:white;font-size:23px;box-shadow:0 4px #124675;padding:8px}.boardFrame{margin-top:3vh;padding:6px;background:linear-gradient(#4d7247,#2e5137);border:5px solid #6d5539;border-radius:18px;box-shadow:0 8px #32412b,0 13px 20px #16392277}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.tile{border:1px solid #78996e;aspect-ratio:1;min-width:0;padding:0;position:relative;border-radius:10px;background:radial-gradient(circle at 50% 10%,#7e9f72,#476c4b 90%);box-shadow:inset 0 -3px #2a4c36;display:grid;place-items:center;overflow:hidden}.tile:nth-child(even){background:radial-gradient(circle at 50% 10%,#73946b,#406a4a 90%)}.tile.near{box-shadow:inset 0 0 0 2px #d9f29b,inset 0 -3px #2a4c36}.tile:active{filter:brightness(1.3)}.tile .frogSvg{width:96%;height:96%;filter:drop-shadow(0 3px 2px #0b332a88)}.tile .snakeSvg{width:115%;height:115%;filter:drop-shadow(0 3px 3px #0b332a88);animation:bob 1.4s infinite}.tail{position:absolute;inset:23%;border-radius:40%;background:repeating-linear-gradient(35deg,#72d747 0 8px,#369b34 8px 14px);border:3px solid #236c32}.powerRow{display:flex;gap:9px;margin:22px 8px 0}.power{flex:1;border:3px solid #b7844b;border-radius:17px;min-height:76px;background:linear-gradient(#fff2cf,#dfb77c);box-shadow:inset 0 3px #fff9e8,0 5px #8b5f37;font-size:37px;position:relative}.power b{position:absolute;right:3px;bottom:2px;border-radius:50%;background:#e83c39;color:#fff;border:2px solid white;font-size:14px;min-width:25px}.power:disabled{opacity:.5}.message{text-align:center;color:#fff7d7;font-weight:850;text-shadow:0 2px 2px #18432e;margin:18px 6px 0;min-height:44px;font-size:14px}.overlay{position:absolute;inset:0;background:#071b13b9;z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:linear-gradient(#fff3d3,#f8d8a4);border:5px solid #b57c43;border-radius:24px;padding:15px;max-width:410px;width:100%;box-shadow:0 12px 30px #0008}.modal h2{text-align:center;margin:0 0 12px;background:linear-gradient(#bb783c,#87451e);border:3px solid #713c20;border-radius:15px;padding:11px;color:#fff;font-size:26px;text-shadow:0 2px #6c3419}.rule{display:flex;gap:10px;align-items:center;padding:10px 3px;border-bottom:1px solid #d4af7e;font-size:14px;font-weight:750}.rule .emoji{font-size:30px;min-width:40px;text-align:center}.modal .play{font-size:20px;margin:14px auto 0}.gameLabel{text-align:center;color:#fff5ce;font-weight:1000;font-size:17px;text-shadow:0 2px #22523b}.notice{text-align:center;font-size:12px;color:#f5ffe9;margin-top:12px}@media(max-height:760px){.boardFrame{margin-top:7px}.powerRow{margin-top:11px}.logo{margin-top:5vh}.hero{height:26vh;min-height:160px}.hero .big{font-size:130px}.gameTop{margin-bottom:8px}}
</style></head><body><div class="app"><div class="forest"><span class="leaf a">🌿🍃</span><span class="leaf b">🍃🌿</span><span class="leaf c">🌸🌿</span><span class="leaf d">🌿🌺</span></div><section class="screen" id="home"><div class="logoBoard"><div class="logo">SNAKE<span>FROG BLAST</span></div></div><div class="hero"><span class="big">🐍</span><span class="small">🐸 🐸</span></div><button class="play" id="play">▶ Oyna</button><div class="menuRow"><button id="levels"><span>🏆</span>Bölümler</button><button id="how"><span>🗺️</span>Nasıl Oynanır?</button><button id="stats"><span>⭐</span>Puanım</button></div></section><section class="screen hidden" id="game"><div class="gameLabel">🌿 BÖLÜM 1 🌿</div><div class="gameTop"><div class="wood goal"><label>Hedef</label><div class="goalGrid" id="targets"></div></div><div class="wood single"><label>Hamle</label><strong id="moves">25</strong></div><div class="wood single"><label>Puan</label><strong id="score">0</strong></div><button class="pause" id="pause">Ⅱ</button></div><div class="boardFrame"><div class="board" id="board"></div></div><div class="powerRow"><button class="power" id="bomb" aria-label="Bomba">💣<b id="bombCount">3</b></button><button class="power" id="rainbow" aria-label="Renkli top">🌈<b id="rainbowCount">3</b></button><button class="power" id="shuffle" aria-label="Karıştır">🔀<b id="shuffleCount">3</b></button></div><div class="message" id="msg">Yılanın yanındaki kurbağaya dokun!</div><div class="notice">Aynı renk seri: 3+ puan · 5 💣 · 6 🌈</div></section><div class="overlay hidden" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><div id="modalContent"></div><button class="play" id="modalOK">Anladım!</button></div></div></div><script>
const $=id=>document.getElementById(id),COL=['#f45155','#339cfa','#ffd02f','#55d94a','#a85ae5'];let board=[],pos=20,moves=25,score=0,goals=[0,0,0],power=[3,3,3],last=-1,chain=0,locked=false,finished=false,modalCallback=null,tail=[];const rand=()=>Math.random()*5|0;const adjacent=(a,b)=>Math.abs((a/6|0)-(b/6|0))+Math.abs(a%6-b%6)===1;
function frog(t){let c=COL[t];return '<svg class="frogSvg" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="g'+t+'" cx=".27" cy=".15" r=".9"><stop stop-color="#fff" stop-opacity=".68"/><stop offset=".3" stop-color="'+c+'"/><stop offset="1" stop-color="'+c+'"/></radialGradient></defs><ellipse cx="50" cy="86" rx="36" ry="8" fill="#102b20" opacity=".28"/><ellipse cx="50" cy="56" rx="40" ry="33" fill="url(#g'+t+')" stroke="#285e38" stroke-width="2.5"/><circle cx="28" cy="28" r="17" fill="'+c+'" stroke="#285e38" stroke-width="2.5"/><circle cx="72" cy="28" r="17" fill="'+c+'" stroke="#285e38" stroke-width="2.5"/><ellipse cx="29" cy="29" rx="11" ry="12" fill="#fff"/><ellipse cx="71" cy="29" rx="11" ry="12" fill="#fff"/><circle cx="33" cy="30" r="5.5" fill="#182e26"/><circle cx="67" cy="30" r="5.5" fill="#182e26"/><circle cx="35" cy="58" r="2.8" fill="#345d40"/><circle cx="65" cy="58" r="2.8" fill="#345d40"/><path d="M35 67 Q50 82 65 67" stroke="#5a4435" stroke-width="3.5" stroke-linecap="round" fill="none"/><ellipse cx="21" cy="56" rx="6" ry="4" fill="#fff" opacity=".2"/></svg>'}
function snake(){return '<svg class="snakeSvg" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="sn" x2="1" y2="1"><stop stop-color="#c6ff60"/><stop offset=".55" stop-color="#54c832"/><stop offset="1" stop-color="#288c39"/></linearGradient></defs><path d="M12 76 C30 96 70 92 65 68 S24 65 33 44 S80 54 77 28" fill="none" stroke="#2e8836" stroke-width="22" stroke-linecap="round"/><path d="M12 76 C30 96 70 92 65 68 S24 65 33 44 S80 54 77 28" fill="none" stroke="#83df3c" stroke-width="14" stroke-linecap="round" stroke-dasharray="12 8"/><ellipse cx="72" cy="27" rx="25" ry="23" fill="url(#sn)" stroke="#2d8c34" stroke-width="3"/><circle cx="61" cy="13" r="11" fill="#75d941"/><circle cx="82" cy="13" r="11" fill="#75d941"/><ellipse cx="62" cy="12" rx="7" ry="8" fill="#fff"/><ellipse cx="81" cy="12" rx="7" ry="8" fill="#fff"/><circle cx="65" cy="13" r="4" fill="#1a3023"/><circle cx="78" cy="13" r="4" fill="#1a3023"/><path d="M61 33 Q73 44 86 32" stroke="#28572e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M84 37 Q96 50 98 38" stroke="#ef7186" stroke-width="4" fill="none"/></svg>'}
function message(s){$('msg').textContent=s}function render(){$('board').innerHTML='';board.forEach((t,i)=>{let e=document.createElement('button');e.className='tile'+(adjacent(pos,i)?' near':'');e.innerHTML=i===pos?snake():frog(t);if(tail.includes(i)&&i!==pos)e.innerHTML='<span class="tail"></span>'+e.innerHTML;e.onclick=()=>tap(i);$('board').appendChild(e)});$('targets').innerHTML=[0,1,2].map(i=>'<div><i>'+frog(i)+'</i><b>'+Math.min(goals[i],10)+'/10</b></div>').join('');$('moves').textContent=moves;$('score').textContent=score;['bomb','rainbow','shuffle'].forEach((n,i)=>{$(n+'Count').textContent=power[i];$(n).disabled=power[i]<=0||finished||locked})}
function reset(){board=Array.from({length:36},rand);pos=20;moves=25;score=0;goals=[0,0,0];power=[3,3,3];last=-1;chain=0;tail=[];locked=false;finished=false;$('home').classList.add('hidden');$('game').classList.remove('hidden');message('Yanındaki kurbağaya dokun, yılan onu yesin!');render()}
function check(){if(goals.every(x=>x>=10)){finished=true;show('🏆 Bölüm Tamamlandı!','<p style="text-align:center">Tebrikler! '+score+' puan topladın.</p>','Yeniden Oyna',reset)}else if(moves===0){finished=true;show('⏳ Hamle Bitti','<p style="text-align:center">Hedefe ulaşamadın. Yeniden dene!</p>','Tekrar Dene',reset)}}
function blast(ids){let seen=new Set(ids.filter(i=>i>=0&&i<36&&i!==pos));seen.forEach(i=>{if(board[i]<3)goals[board[i]]++;score+=100;board[i]=rand()})}
function around(){let r=pos/6|0,c=pos%6,ids=[];for(let y=r-1;y<=r+1;y++)for(let x=c-1;x<=c+1;x++)if(y>=0&&y<6&&x>=0&&x<6)ids.push(y*6+x);blast(ids)}
function same(t){blast(board.map((v,i)=>v===t?i:-1))}
function tap(i){if(locked||finished||i===pos)return;if(!adjacent(i,pos)){message('🐍 Yılan yalnızca komşu kareye ilerleyebilir.');return}locked=true;let t=board[i];chain=t===last?chain+1:1;last=t;tail.unshift(pos);tail=tail.slice(0,2);pos=i;board[i]=rand();if(t<3)goals[t]++;score+=100;moves--;message('🐸 '+chain+' aynı renk kurbağa!');render();setTimeout(()=>{if(chain===5){around();message('💣 Beşli seri! Bomba patladı!')}else if(chain>=6){same(t);message('🌈 Altılı seri! Renkli top!');chain=0;last=-1}locked=false;render();check()},220)}
function usePower(i){if(locked||finished||power[i]<1)return;power[i]--;moves--;chain=0;last=-1;if(i===0){around();message('💣 Bomba patladı!')}else if(i===1){same(rand());message('🌈 Aynı renk kurbağalar temizlendi!')}else{board=board.map(rand);message('🔀 Tahta karıştırıldı!')}render();check()}
function show(title,body,ok,cb){$('modalTitle').textContent=title;$('modalContent').innerHTML=body;$('modalOK').textContent=ok;modalCallback=cb;$('overlay').classList.remove('hidden')}
function rules(){show('Nasıl Oynanır?','<div class="rule"><span class="emoji">🐍</span><span>Yanındaki kurbağaya dokun. Yılan hareket ederek onu yer.</span></div><div class="rule"><span class="emoji">🐸</span><span>Aynı renk kurbağaları art arda yiyerek seri oluştur.</span></div><div class="rule"><span class="emoji">✨</span><span>3 veya daha fazla aynı renk kurbağa puan kazandırır.</span></div><div class="rule"><span class="emoji">💣</span><span>5 aynı renk kurbağa çevresini temizler.</span></div><div class="rule"><span class="emoji">🌈</span><span>6 aynı renk kurbağa o rengin tamamını temizler.</span></div><div class="rule"><span class="emoji">🎯</span><span>25 hamlede kırmızı, mavi ve sarıdan 10’ar tane topla!</span></div>','Anladım!',()=>{})}
$('play').onclick=reset;$('how').onclick=rules;$('levels').onclick=()=>show('🏆 Bölümler','<p style="text-align:center">Şimdilik 1. bölüm oynanabilir. Yeni bölümler eklenecek.</p>','Tamam',()=>{});$('stats').onclick=()=>show('⭐ Puanım','<p style="text-align:center">Oyun içi puanlar bölüm sırasında görüntülenir.</p>','Tamam',()=>{});$('pause').onclick=()=>show('⏸ Duraklatıldı','<p style="text-align:center">Oyun duraklatıldı.</p>','Devam',()=>{});['bomb','rainbow','shuffle'].forEach((n,i)=>$(n).onclick=()=>usePower(i));$('modalOK').onclick=()=>{$('overlay').classList.add('hidden');if(modalCallback)modalCallback()};
</script></body></html>
