<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#214c37"><title>Snake Frog Rush · Yeni Prototip</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#193d30;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}#game{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none}#error{position:absolute;inset:30% 6%;padding:24px;background:#233e32;border-radius:18px;display:none;z-index:5}#back{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 5px);left:12px;color:#d9f0d6;font-size:11px;opacity:.8;z-index:2}#back a{color:inherit}</style></head><body><div id="game"></div><div id="error"></div><div id="back">YENİ PROTOTİP · <a href="../">Eski oyuna dön</a></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
if(!window.Phaser){let e=document.getElementById('error');e.style.display='block';e.textContent='Oyun motoru yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.'}
else{
const W=390,H=780,FIELD={top:102,bottom:728},TAU=Math.PI*2;
class Forest extends Phaser.Scene{
constructor(){super('Forest')}
create(){this.cameras.main.setBackgroundColor('#729f69');this.makeTextures();this.state='ready';this.score=0;this.caught=0;this.remaining=75;this.length=85;this.snake=[];this.heading=-Math.PI/2;this.target=null;this.frogs=[];this.spiders=[];this.obstacles=[];this.lastHop=0;this.lastSpawn=0;this.elapsed=0;this.paintWorld();this.buildUI();this.input.on('pointerdown',p=>this.handlePointer(p));this.input.on('pointermove',p=>{if(p.isDown)this.handlePointer(p)});this.showIntro()}
makeTextures(){let g=this.make.graphics({x:0,y:0},false);g.fillStyle(0xffffff);g.fillCircle(16,16,16);g.generateTexture('dot',32,32);g.destroy()}
paintWorld(){let g=this.add.graphics();g.fillGradientStyle(0x8ab778,0x91b77c,0x548f68,0x548c6a);g.fillRect(0,0,W,H);let seed=8127;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<420;i++){let x=rnd()*W,y=FIELD.top+rnd()*(FIELD.bottom-FIELD.top);g.fillStyle(i%3===0?0xb1c98c:0x5b986a,.13+rnd()*.13);g.fillEllipse(x,y,3+rnd()*13,2+rnd()*6)}for(let edge of [0,W]){for(let i=0;i<45;i++){let x=edge+(edge===0?1:-1)*(rnd()*25),y=FIELD.top+rnd()*(FIELD.bottom-FIELD.top);g.fillStyle(i%2?0x286d48:0x397b4c,.65);g.fillEllipse(x,y,13+rnd()*20,14+rnd()*20)}}for(let i=0;i<22;i++){let x=rnd()*W,y=FIELD.top+rnd()*(FIELD.bottom-FIELD.top);g.fillStyle(0xd8d7a3,.7);g.fillCircle(x,y,1+rnd()*2.5)}g.lineStyle(3,0x3d704d,.5);g.strokeRoundedRect(4,FIELD.top,382,FIELD.bottom-FIELD.top,12)}
buildUI(){let g=this.add.graphics();g.fillStyle(0x173d2e,.88);g.fillRoundedRect(9,10,372,81,15);g.lineStyle(2,0xa7c48b,.5);g.strokeRoundedRect(9,10,372,81,15);this.add.text(23,18,'🐸  YAKALANAN',{fontFamily:'Arial',fontSize:'12px',fontStyle:'bold',color:'#d6e9c5'});this.add.text(166,18,'⏱  SÜRE',{fontFamily:'Arial',fontSize:'12px',fontStyle:'bold',color:'#d6e9c5'});this.add.text(279,18,'⭐ PUAN',{fontFamily:'Arial',fontSize:'12px',fontStyle:'bold',color:'#d6e9c5'});this.countText=this.add.text(27,42,'0 / 12',{fontFamily:'Arial',fontSize:'28px',fontStyle:'bold'});this.timeText=this.add.text(176,42,'75',{fontFamily:'Arial',fontSize:'28px',fontStyle:'bold'});this.scoreText=this.add.text(285,42,'0',{fontFamily:'Arial',fontSize:'28px',fontStyle:'bold'});this.add.text(W/2,744,'PARMAĞINLA YÖN VER  ·  KURBAĞALARI YAKALA',{fontFamily:'Arial',fontSize:'11px',color:'#e4f5d6'}).setOrigin(.5);this.graphics=this.add.graphics()}
showIntro(){this.overlay=this.add.container(0,0);let bg=this.add.graphics();bg.fillStyle(0x143629,.92);bg.fillRoundedRect(27,225,336,286,22);bg.lineStyle(2,0xb4d18d);bg.strokeRoundedRect(27,225,336,286,22);this.overlay.add(bg);this.overlay.add(this.add.text(W/2,256,'SNAKE FROG RUSH',{fontFamily:'Arial',fontSize:'26px',fontStyle:'bold',color:'#e4f3b0'}).setOrigin(.5));this.overlay.add(this.add.text(W/2,320,'🐍  Yılan durmadan ilerler\n🐸  Kurbağa yedikçe uzar\n🕷️  Örümceğe çarparsan kaybedersin\n🪨  Taş ve kütüklerden kaç\n↔️  Kenardan çık, karşıdan gir',{fontFamily:'Arial',fontSize:'16px',lineSpacing:12,align:'center',color:'#f3f6e8'}).setOrigin(.5));let b=this.add.rectangle(W/2,465,220,54,0x43b83b).setStrokeStyle(3,0x9ae477).setInteractive({useHandCursor:true});this.overlay.add(b);this.overlay.add(this.add.text(W/2,465,'OYNA',{fontFamily:'Arial',fontSize:'23px',fontStyle:'bold'}).setOrigin(.5));b.on('pointerdown',()=>this.startRound())}
startRound(){if(this.overlay){this.overlay.destroy();this.overlay=null}this.state='playing';this.score=0;this.caught=0;this.remaining=75;this.length=82;this.elapsed=0;this.heading=-Math.PI/2;this.target=null;this.snake=[];for(let i=0;i<60;i++)this.snake.push({x:W/2,y:H/2+i*2});this.frogs=[];this.spiders=[];this.obstacles=[];this.spawnObstacles();for(let i=0;i<6;i++)this.spawnFrog();this.spawnFrog(true);this.spawnSpider();this.updateHud()}
spawnObstacles(){let spots=[[90,245],[296,368],[106,545],[304,622]];spots.forEach((p,i)=>this.obstacles.push({x:p[0],y:p[1],r:i%2?21:17,type:i%2?'log':'rock'}))}
freeSpot(min=55){for(let i=0;i<80;i++){let x=30+Math.random()*(W-60),y=FIELD.top+32+Math.random()*(FIELD.bottom-FIELD.top-64);if(Math.hypot(x-W/2,y-H/2)<min)continue;if(this.obstacles.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+28))continue;if(this.frogs.some(f=>Math.hypot(f.x-x,f.y-y)<38))continue;return{x,y}}return{x:55,y:155}}
spawnFrog(gold=false){let p=this.freeSpot();this.frogs.push({...p,gold,phase:Math.random()*TAU,jump:0})}
spawnSpider(){let p=this.freeSpot(100);this.spiders.push({...p,phase:0,vx:19,vy:11})}
handlePointer(p){if(this.state!=='playing'||p.y<FIELD.top||p.y>FIELD.bottom)return;this.target={x:p.x,y:p.y}}
update(time,delta){if(this.state!=='playing')return;let dt=Math.min(delta/1000,.045);this.elapsed+=dt;this.remaining-=dt;if(this.remaining<=0){this.finish(false,'Süre bitti!');return}let h=this.snake[0];if(this.target){let a=Math.atan2(this.target.y-h.y,this.target.x-h.x);let d=Phaser.Math.Angle.Wrap(a-this.heading);this.heading+=Phaser.Math.Clamp(d,-4.4*dt,4.4*dt)}let x=h.x+Math.cos(this.heading)*118*dt,y=h.y+Math.sin(this.heading)*118*dt;if(x<0)x+=W;if(x>W)x-=W;if(y<FIELD.top)y+=FIELD.bottom-FIELD.top;if(y>FIELD.bottom)y-=FIELD.bottom-FIELD.top;let prev=h;this.snake[0]={x,y};for(let i=1;i<this.snake.length;i++){let cur=this.snake[i],dx=prev.x-cur.x,dy=prev.y-cur.y;if(dx>W/2)dx-=W;if(dx< -W/2)dx+=W;let span=FIELD.bottom-FIELD.top;if(dy>span/2)dy-=span;if(dy< -span/2)dy+=span;let d=Math.hypot(dx,dy);if(d>2.8){cur.x=(prev.x-dx/d*2.8+W)%W;cur.y=FIELD.top+((prev.y-dy/d*2.8-FIELD.top+span)%span)}prev=cur}
this.snake.length=Math.min(this.snake.length,this.length);while(this.snake.length<this.length){let t=this.snake[this.snake.length-1];this.snake.push({...t})}
for(let i=this.frogs.length-1;i>=0;i--){let f=this.frogs[i];f.phase+=dt*3;f.jump=Math.max(0,f.jump-dt*2);let dx=Math.abs(x-f.x),dy=Math.abs(y-f.y);dx=Math.min(dx,W-dx);dy=Math.min(dy,FIELD.bottom-FIELD.top-dy);if(Math.hypot(dx,dy)<22){this.frogs.splice(i,1);this.caught++;this.score+=f.gold?500:100;this.length+=f.gold?18:9;this.spawnFrog(f.gold);this.updateHud();if(this.caught>=12){this.finish(true,'Bölüm tamamlandı!');return}}}
for(let o of this.obstacles){if(Math.hypot(x-o.x,y-o.y)<o.r+9){this.finish(false,'Engele çarptın!');return}}
for(let s of this.spiders){s.phase+=dt;s.x+=Math.cos(s.phase*1.7)*s.vx*dt;s.y+=Math.sin(s.phase*1.3)*s.vy*dt;if(Math.hypot(x-s.x,y-s.y)<19){this.finish(false,'Örümceğe yakalandın!');return}}
if(this.elapsed-this.lastHop>1.8){this.lastHop=this.elapsed;for(let f of this.frogs){if(Math.random()<.5){f.x=Phaser.Math.Clamp(f.x+(Math.random()-.5)*44,22,W-22);f.y=Phaser.Math.Clamp(f.y+(Math.random()-.5)*44,FIELD.top+24,FIELD.bottom-24);f.jump=1}}}this.updateHud();this.draw()}
updateHud(){this.countText.setText(this.caught+' / 12');this.timeText.setText(String(Math.ceil(this.remaining)));this.scoreText.setText(String(this.score))}
draw(){let g=this.graphics;g.clear();for(let o of this.obstacles){g.fillStyle(0x244d36,.23);g.fillEllipse(o.x+3,o.y+9,o.r*2.3,12);if(o.type==='rock'){g.fillStyle(0x87978b);g.fillCircle(o.x,o.y,o.r);g.fillStyle(0xb9c3aa,.8);g.fillEllipse(o.x-4,o.y-6,o.r*.9,o.r*.6)}else{g.fillStyle(0x69472b);g.fillRoundedRect(o.x-24,o.y-11,48,22,8);g.lineStyle(3,0xb78c53);g.strokeRoundedRect(o.x-24,o.y-11,48,22,8)}}
for(let f of this.frogs){let yy=f.y-Math.sin(f.jump*Math.PI)*12+Math.sin(f.phase)*2,c=f.gold?0xf3c342:0x65b943;g.fillStyle(0x23452e,.22);g.fillEllipse(f.x,f.y+12,29,8);if(f.gold){g.fillStyle(0xffe784,.22);g.fillCircle(f.x,yy,25)}g.fillStyle(c);for(let sign of [-1,1]){g.fillEllipse(f.x+sign*12,yy+10,10,7);g.fillEllipse(f.x+sign*16,yy+14,10,5)}g.fillEllipse(f.x,yy+2,31,27);g.fillCircle(f.x-9,yy-10,8);g.fillCircle(f.x+9,yy-10,8);g.fillStyle(0xffffff);g.fillCircle(f.x-9,yy-11,5);g.fillCircle(f.x+9,yy-11,5);g.fillStyle(0x1b3528);g.fillCircle(f.x-8,yy-11,2.8);g.fillCircle(f.x+10,yy-11,2.8);g.lineStyle(1.6,0x326b39);g.beginPath();g.arc(f.x,yy+3,7,.1,Math.PI-.1);g.strokePath()}
for(let s of this.spiders){g.lineStyle(2.7,0x202326);for(let sign of [-1,1])for(let k=0;k<4;k++){let yy=s.y-9+k*6;g.lineBetween(s.x+sign*6,yy,s.x+sign*(14+k%2*4),yy+(k-1.5)*6)}g.fillStyle(0x1e2225);g.fillCircle(s.x,s.y,11);g.fillStyle(0xcc4b39);g.fillCircle(s.x,s.y-3,4);g.fillStyle(0xffffff);g.fillCircle(s.x-4,s.y+4,2);g.fillCircle(s.x+4,s.y+4,2)}
const pts=this.snake;g.lineStyle(19,0x2c7238,1);this.strokeSnake(g,pts);g.lineStyle(14,0x75cb43,1);this.strokeSnake(g,pts);g.lineStyle(3,0xb6e877,.7);this.strokeSnake(g,pts);let h=pts[0];g.fillStyle(0x64c842);g.fillEllipse(h.x,h.y,28,30);let a=this.heading;let px=Math.cos(a+Math.PI/2)*7,py=Math.sin(a+Math.PI/2)*7;g.fillStyle(0xf5fff1);g.fillCircle(h.x+px+Math.cos(a)*6,h.y+py+Math.sin(a)*6,5);g.fillCircle(h.x-px+Math.cos(a)*6,h.y-py+Math.sin(a)*6,5);g.fillStyle(0x1b3728);g.fillCircle(h.x+px+Math.cos(a)*8,h.y+py+Math.sin(a)*8,2.5);g.fillCircle(h.x-px+Math.cos(a)*8,h.y-py+Math.sin(a)*8,2.5)}
strokeSnake(g,pts){g.beginPath();let last=null;for(let i=pts.length-1;i>=0;i--){let p=pts[i];if(!last||Math.abs(p.x-last.x)>W/2||Math.abs(p.y-last.y)>(FIELD.bottom-FIELD.top)/2)g.moveTo(p.x,p.y);else g.lineTo(p.x,p.y);last=p}g.strokePath()}
finish(win,reason){this.state='done';this.target=null;this.overlay=this.add.container(0,0);let g=this.add.graphics();g.fillStyle(0x173b2d,.93);g.fillRoundedRect(33,265,324,236,20);this.overlay.add(g);this.overlay.add(this.add.text(W/2,302,win?'🏆 KAZANDIN!':'OYUN BİTTİ',{fontFamily:'Arial',fontSize:'27px',fontStyle:'bold'}).setOrigin(.5));this.overlay.add(this.add.text(W/2,360,reason+'\n'+this.caught+' kurbağa · '+this.score+' puan',{fontFamily:'Arial',fontSize:'18px',align:'center',lineSpacing:9}).setOrigin(.5));let b=this.add.rectangle(W/2,453,220,50,0x45b43c).setStrokeStyle(2,0xb2e48b).setInteractive();this.overlay.add(b);this.overlay.add(this.add.text(W/2,453,'TEKRAR OYNA',{fontFamily:'Arial',fontSize:'19px',fontStyle:'bold'}).setOrigin(.5));b.on('pointerdown',()=>this.startRound())}
}
new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:W,height:H,backgroundColor:'#628e67',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Forest],render:{pixelArt:false,antialias:true}});
}
