<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kobra + Elma • Ayrı Oyun Testi</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#142c20;color:#fff;font:14px system-ui;touch-action:none}#ui{position:fixed;top:0;left:0;right:0;padding:12px;background:#07170ec9;z-index:4}#ui label{display:inline-block;background:#dbeecf;color:#18361d;padding:9px;border-radius:9px;font-weight:bold}#ui input{display:none}#status{margin:7px 0}#help{font-size:12px;color:#d5dfd5}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="ui"><b>Kobra + Elma | Bağımsız Test</b><div id="status">3D motoru yükleniyor…</div><label>Kobra GLB dosyasını seç <input id="file" type="file" accept=".glb,model/gltf-binary"></label><div id="help">Bir kez snake_cobra_animated_base_model.glb seç. Parmağınla sahnede sürükleyerek yılanı hareket ettir. Ana oyun değişmedi.</div></div><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const status=document.querySelector('#status'),scene=new THREE.Scene();scene.background=new THREE.Color(0x25482f);scene.fog=new THREE.Fog(0x25482f,13,29);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,80);camera.position.set(0,12,12);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x385c36,2.4));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-4,10,7);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x386342,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);const appleMat=new THREE.MeshStandardMaterial({color:0xd92e28,roughness:.4}),leafMat=new THREE.MeshStandardMaterial({color:0x24702d});let apples=[],score=0;for(let i=0;i<9;i++){const a=new THREE.Group(),fruit=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),appleMat);fruit.scale.y=.85;a.add(fruit);const leaf=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),leafMat);leaf.position.set(.14,.3,0);leaf.scale.set(1.5,.4,.7);a.add(leaf);a.position.set((Math.random()-.5)*12,.35,(Math.random()-.5)*12);scene.add(a);apples.push(a)}let snake=null,mixer=null,heading=0;const player=new THREE.Group();scene.add(player);document.querySelector('#file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;status.textContent='Kobra açılıyor…';try{const buffer=await file.arrayBuffer();new GLTFLoader().parse(buffer,'',g=>{if(snake)player.remove(snake);snake=g.scene;const box=new THREE.Box3().setFromObject(snake),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());snake.position.sub(center);const factor=2.8/(Math.max(size.x,size.y,size.z)||1);snake.scale.setScalar(factor);player.add(snake);mixer=new THREE.AnimationMixer(snake);for(const a of g.animations)mixer.clipAction(a).play();status.textContent='Kobra yüklendi • '+g.animations.length+' animasyon • Elma: '+score},e=>status.textContent='Model hatası: '+e.message)}catch(err){status.textContent='Dosya hatası: '+err.message}});let pointer=null,target=new THREE.Vector3(0,0,0);renderer.domElement.addEventListener('pointerdown',e=>{pointer=e.pointerId;renderer.domElement.setPointerCapture(pointer)});renderer.domElement.addEventListener('pointermove',e=>{if(pointer!==e.pointerId)return;const x=(e.clientX/innerWidth)*2-1,y=-(e.clientY/innerHeight)*2+1;const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(x,y),camera);const hit=new THREE.Vector3();if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),hit))target.copy(hit)});renderer.domElement.addEventListener('pointerup',()=>pointer=null);const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);if(snake){const diff=target.clone().sub(player.position);diff.y=0;if(diff.length()>.25){const dir=diff.normalize();player.position.addScaledVector(dir,dt*2.5);heading=Math.atan2(dir.x,dir.z);player.rotation.y=heading}for(const a of apples)if(a.position.distanceTo(player.position)<.7){a.position.set((Math.random()-.5)*12,.35,(Math.random()-.5)*12);score++;status.textContent='Kobra yüklendi • Elma: '+score}}renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
