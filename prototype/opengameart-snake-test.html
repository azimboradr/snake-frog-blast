<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animasyonlu Yılan Testi</title><style>body{margin:0;background:#152b20;color:white;font:15px system-ui}#status{position:fixed;z-index:2;top:12px;left:12px;right:12px;background:#000b;padding:14px;border-radius:10px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="status">Model kontrol ediliyor…</div><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const status=document.querySelector('#status'),scene=new THREE.Scene();scene.background=new THREE.Color('#294b33');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);camera.position.set(3,3,6);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x557744,3));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,6,4);scene.add(light);const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:'#426a43'}));ground.rotation.x=-Math.PI/2;ground.position.y=-1;scene.add(ground);let mixer=null;new GLTFLoader().load('./assets/opengameart-snake.glb',g=>{const snake=g.scene;scene.add(snake);const bounds=new THREE.Box3().setFromObject(snake),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());snake.position.sub(center);snake.scale.setScalar(3/(Math.max(size.x,size.y,size.z)||1));mixer=new THREE.AnimationMixer(snake);g.animations.forEach(a=>mixer.clipAction(a).play());status.textContent='Yılan açıldı • '+g.animations.length+' animasyon • '+(g.animations.length?'Hareket oynatılıyor':'Animasyon bulunamadı')},undefined,e=>{status.textContent='Model henüz hazır değil veya açılamadı: '+e.message});const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{if(mixer)mixer.update(clock.getDelta());renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
