   load('../assets/models/snake_uv_pbr.glb'),
   load('../assets/models/frog_detailed.glb')
  ]);
  if(frogResult.status==='fulfilled'){
   const frogAsset=frogResult.value.scene;
   frogAsset.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true}});
   assetCache.frog=frogAsset;
   // Replace only artwork. Keep each existing frog's position, collision and behavior.
   for(const f of frogs){
    const root=f.obj;

   }
   glbStatus.frog=true;assetIndicator.textContent='Kurbağa GLB yüklendi';
  }else console.warn('Frog GLB not found; original visuals retained',frogResult.reason);
  if(snakeResult.status==='fulfilled'){
   const source=snakeResult.value.scene;
   source.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true}});
   // The GLB contains a straight body; the live snake needs its deformable body
   // for accurate turning. Reuse its authored PBR materials on the deforming mesh.
   let bodyMaterial=null;
   source.traverse(obj=>{if(obj.isMesh&&obj.geometry&&obj.geometry.boundingBox===null)obj.geometry.computeBoundingBox();

   }

 }catch(err){console.error('GLB integration unavailable; fallback scene remains playable',err);assetIndicator.textContent='GLB yükleme hatası: eski modeller etkin'}
}
