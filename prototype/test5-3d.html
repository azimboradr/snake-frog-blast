<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Snake Frog Rush 3D | Test 5</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#1d4031;color:white;font-family:system-ui;touch-action:none}canvas{display:block;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:4%;width:92%;padding:12px;background:#173c30dd;border-radius:16px;display:flex;justify-content:space-around;font-weight:800;pointer-events:none}small{display:block;font-size:11px;opacity:.8}#bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);width:100%;text-align:center;font-size:12px;pointer-events:none}#overlay{position:fixed;inset:0;background:#142b21b5;display:flex;align-items:center;justify-content:center}#panel{background:#163b2feF;border:1px solid #a1ce83;border-radius:22px;padding:24px;text-align:center;width:85%;max-width:360px}button{background:#65bb44;border:2px solid #c2ef8e;border-radius:12px;color:white;font-size:20px;font-weight:800;padding:14px 28px}p{line-height:1.7;font-size:14px}#error{position:fixed;top:35%;left:5%;width:90%;background:#593027;padding:20px;display:none}</style></head><body><div id="hud"><div><small>🐸 HEDEF</small><span id="count">0 / 8</span></div><div><small>⏱ SÜRE</small><span id="time">77</span></div><div><small>❤️ CAN</small><span id="life">♥♥♥</span></div></div><div id="bottom">TEST 5 · GERÇEK 3D · BÖLÜM <span id="lvl">1</span> · PUAN <span id="points">0</span></div><div id="overlay"><div id="panel"><h2>SNAKE FROG RUSH 3D</h2><p>Parmağını sürükleyerek yön ver.<br>Bırakınca yılan aynı yönde devam eder.<br>Kurbağaları yakala, engellerden kaç!</p><button id="play">TEST 5 · OYNA</button></div></div><div id="error"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script><script>
if(!window.THREE){let e=document.getElementById('error');e.style.display='block';e.textContent='3D motor yüklenemedi. Sayfayı yenileyip tekrar dene.'}else{
const T=THREE,S=new T.Scene();S.background=new T.Color(0x83ac91);
const R=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.7));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(R.domElement);
const C=new T.OrthographicCamera(-10,10,19,-19,.1,100);C.position.set(0,37,8);C.lookAt(0,0,0);
S.add(new T.HemisphereLight(0xf4ffe9,0x527454,2));let sun=new T.DirectionalLight(0xffe3aa,2);sun.position.set(-8,18,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;S.add(sun);
const M=c=>new T.MeshStandardMaterial({color:c,roughness:.83}),green=M(0x78a86d),water=M(0x5297a1),leaf=[M(0x2e6a42),M(0x477f4c),M(0x63995a)],rock=M(0x89978b),wood=M(0x73513a),frogM=M(0x5bab4a),goldM=M(0xe9b83c),white=M(0xffffff),black=M(0x1c3226),snakeM=M(0x539d48),headM=M(0x79bd57),spiderM=M(0x292c2b);
const sphere=new T.SphereGeometry(1,12,9);
function add(geo,mat,x=0,y=0,z=0){let m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;S.add(m);return m}
let ground=add(new T.PlaneGeometry(19,34),green,0,-.13,0);ground.rotation.x=-Math.PI/2;ground.castShadow=false;
for(let side of [-1,1]){let m=add(new T.PlaneGeometry(1.2,34),water,side*9.8,-.11,0);m.rotation.x=-Math.PI/2;m.castShadow=false}
let seed=9721;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<140;i++){let x=(rand()-.5)*20,z=(rand()-.5)*33;if(Math.abs(x)<7.5&&rand()<.86)continue;let b=add(sphere,leaf[i%3],x,.24,z);b.scale.set(.35+rand()*.4,.28+rand()*.45,.35+rand()*.4)}
for(let i=0;i<190;i++){let x=(rand()-.5)*18,z=(rand()-.5)*32;let g=add(new T.ConeGeometry(.06+rand()*.06,.16+rand()*.18,4),leaf[i%3],x,.03,z);g.castShadow=false}
let obstacles=[],frogs=[],spiders=[],parts=[],trail=[];let level=1,score=0,lives=3,caught=0,goal=8,timer=77,invul=0,heading=-Math.PI/2,head={x:0,z:0},speed=3.8,acc=0,playing=false,drag=null;
function clear(arr){for(let v of arr){S.remove(v.obj||v)}arr.length=0}
function free(){for(let k=0;k<100;k++){let x=(rand()-.5)*15,z=(rand()-.5)*27;if(Math.hypot(x-head.x,z-head.z)>3&&obstacles.every(o=>Math.hypot(x-o.x,z-o.z)>1.7))return{x,z}}return{x:6,z:10}}
function spawnFrog(gold=false){let p=free(),group=new T.Group();S.add(group);let body=new T.Mesh(sphere,gold?goldM:frogM);body.scale.set(.4,.26,.34);body.position.y=.26;group.add(body);for(let side of [-1,1]){let e=new T.Mesh(sphere,white);e.scale.set(.12,.12,.12);e.position.set(side*.21,.44,-.22);group.add(e);let pupil=new T.Mesh(sphere,black);pupil.scale.set(.055,.055,.055);pupil.position.set(side*.21,.45,-.32);group.add(pupil);let leg=new T.Mesh(sphere,gold?goldM:frogM);leg.scale.set(.19,.11,.2);leg.position.set(side*.34,.12,.2);group.add(leg)}group.position.set(p.x,0,p.z);frogs.push({...p,gold,obj:group,cool:0,jump:0})}
function spawnObstacle(){let p=free(),isRock=rand()<.7,o=add(isRock?new T.DodecahedronGeometry(.58):new T.CylinderGeometry(.33,.38,1.5,8),isRock?rock:wood,p.x,.4,p.z);if(!isRock)o.rotation.z=Math.PI/2;obstacles.push({...p,r:isRock?.7:.95,obj:o})}
function spawnSpider(){let p=free(),group=new T.Group();S.add(group);let body=new T.Mesh(sphere,spiderM);body.scale.set(.35,.22,.33);body.position.y=.25;group.add(body);for(let side of [-1,1])for(let i=0;i<4;i++){let leg=new T.Mesh(new T.CylinderGeometry(.035,.035,.55,5),spiderM);leg.rotation.z=side*.8;leg.position.set(side*(.34+i*.04),.2,.22-i*.15);group.add(leg)}group.position.set(p.x,0,p.z);spiders.push({...p,obj:group,t:rand()*6})}
function ui(){document.getElementById('count').textContent=caught+' / '+goal;document.getElementById('time').textContent=Math.ceil(timer);document.getElementById('life').textContent='♥'.repeat(lives);document.getElementById('lvl').textContent=level;document.getElementById('points').textContent=score}
function reset(next=false){clear(obstacles);clear(frogs);clear(spiders);clear(parts);if(!next){level=1;score=0}lives=3;caught=0;goal=7+level;timer=Math.max(55,80-level*3);invul=2;heading=-Math.PI/2;head={x:0,z:0};speed=Math.min(6.2,3.7+level*.18);acc=0;trail.length=0;for(let i=0;i<250;i++)trail.push({x:0,z:i*.13});for(let i=0;i<13;i++){let m=add(sphere,i===0?headM:snakeM);m.scale.set(i===0?.42:.30,.27,i===0?.45:.31);parts.push(m)}for(let i=0;i<Math.min(8,1+level);i++)spawnObstacle();for(let i=0;i<5;i++)spawnFrog(i===4);for(let i=0;i<Math.min(3,Math.floor(level/2));i++)spawnSpider();playing=true;drag=null;document.getElementById('overlay').style.display='none';ui()}
function finish(won){playing=false;document.getElementById('overlay').style.display='flex';document.querySelector('h2').textContent=won?'BÖLÜM TAMAMLANDI!':'OYUN BİTTİ';document.querySelector('#panel p').textContent=caught+' kurbağa · '+score+' puan';document.getElementById('play').textContent=won?'SONRAKİ BÖLÜM':'TEKRAR OYNA';document.getElementById('play').onclick=()=>{if(won)level++;reset(won)}}
function damage(){if(invul>0)return;lives--;invul=2.5;head={x:0,z:0};heading=-Math.PI/2;acc=0;trail.length=0;for(let i=0;i<250;i++)trail.push({x:0,z:i*.13});if(lives<=0)finish(false);ui()}
const canvas=R.domElement;canvas.addEventListener('pointerdown',e=>{if(!playing)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6){let angle=Math.atan2(-dy,dx),diff=Math.atan2(Math.sin(angle-heading),Math.cos(angle-heading));heading+=Math.max(-.22,Math.min(.22,diff));drag.x=e.clientX;drag.y=e.clientY}});
function release(e){if(drag&&e.pointerId===drag.id)drag=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
function resize(){let w=innerWidth,h=innerHeight;R.setSize(w,h);let view=37,aspect=w/h;C.left=-view*aspect/2;C.right=view*aspect/2;C.top=view/2;C.bottom=-view/2;C.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const wrap=(n,max)=>n>max?n-2*max:n< -max?n+2*max:n;let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.04,(now-last)/1000);last=now;if(playing){timer-=dt;invul=Math.max(0,invul-dt);if(timer<=0)finish(false);else{acc+=speed*dt;while(acc>=.13){acc-=.13;head.x=wrap(head.x+Math.cos(heading)*.13,8.6);head.z=wrap(head.z+Math.sin(heading)*.13,16);trail.unshift({...head});trail.length=250}
for(let i=0;i<parts.length;i++){let p=trail[Math.min(trail.length-1,i*5)]||head;parts[i].position.set(p.x,.27,p.z);if(i===0){parts[i].rotation.y=-heading-Math.PI/2;parts[i].visible=invul<=0||Math.floor(now/180)%2===0}}
for(let f of [...frogs]){f.cool-=dt;f.jump=Math.max(0,f.jump-dt*2.5);let d=Math.hypot(head.x-f.x,head.z-f.z);if(d>.6&&d<2.4&&f.cool<=0){let a=Math.atan2(f.z-head.z,f.x-head.x);f.x=Math.max(-8,Math.min(8,f.x+Math.cos(a)*.8));f.z=Math.max(-15,Math.min(15,f.z+Math.sin(a)*.8));f.cool=f.gold?1.1:1.6;f.jump=1}f.obj.position.set(f.x,Math.sin(f.jump*Math.PI)*.45,f.z);if(Math.hypot(head.x-f.x,head.z-f.z)<.63){S.remove(f.obj);frogs.splice(frogs.indexOf(f),1);caught++;score+=f.gold?500:100;if(parts.length<45){let m=add(sphere,snakeM);m.scale.set(.29,.26,.3);parts.push(m)}spawnFrog(f.gold);if(caught>=goal){finish(true);break}}}
if(invul<=0){if(obstacles.some(o=>Math.hypot(head.x-o.x,head.z-o.z)<o.r+.3)||spiders.some(s=>Math.hypot(head.x-s.x,head.z-s.z)<.65))damage();else for(let i=9;i<parts.length;i++){let p=trail[i*5];if(!p)continue;let dx=Math.abs(head.x-p.x),dz=Math.abs(head.z-p.z);if(Math.hypot(Math.min(dx,17.2-dx),Math.min(dz,32-dz))<.55){damage();break}}}
for(let s of spiders){s.t+=dt;s.obj.position.set(s.x+Math.sin(s.t)*.2,0,s.z+Math.cos(s.t)*.2)}ui()}}
R.render(S,C)}requestAnimationFrame(frame);document.getElementById('play').onclick=()=>reset(false)}
</script></body></html>
