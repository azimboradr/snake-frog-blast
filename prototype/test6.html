function wrappedDiff(a,b,span){let d=a-b;return d-Math.round(d/span)*span}

function pathPoint(distance){let q=distance/STEP,i=Math.floor(q),f=q-i,a=path[Math.min(i,path.length-1)]||head,b=path[Math.min(i+1,path.length-1)]||a;return{x:a.x+(b.x-a.x)*f,z:a.z+(b.z-a.z)*f}}

bodyGeo.attributes.position.needsUpdate=true;bodyGeo.attributes.normal.needsUpdate=true;bodyGeo.attributes.color.needsUpdate=true;bodyGeo.computeBoundingSphere();headGroup.position.set(head.x,0,head.z);headGroup.rotation.y=-heading-Math.PI/2;headGroup.visible=invincible<=0||Math.floor(gameTime*8)%2===0;body.visible=headGroup.visible}
function clear(list){for(const x of list){scene.remove(x.obj);if(x.obj.geometry)x.obj.geometry.dispose()}list.length=0}
function free(minHead=3){for(let i=0;i<180;i++){let x=(rnd()-.5)*14.8,z=(rnd()-.5)*27;if(Math.hypot(x-head.x,z-head.z)>minHead&&obstacles.every(o=>Math.hypot(x-o.x,z-o.z)>o.r+1.1))return{x,z}}return{x:6,z:11}}
