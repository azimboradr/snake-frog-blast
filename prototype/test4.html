for(let k=0;k<steps;k++){let x=h.x+Math.cos(this.heading)*2.8,y=h.y+Math.sin(this.heading)*2.8;if(x<0)x+=W;if(x>=W)x-=W;if(y<FIELD.top)y+=span;if(y>=FIELD.bottom)y-=span;h={x,y};this.path.unshift(h)}
