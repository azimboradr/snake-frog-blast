name: Convert OpenGameArt snake for isolated test
on:
  push:
    paths:
      - '.github/workflows/convert-snake.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and download CC0 snake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          curl --fail --location --retry 3 'https://opengameart.org/sites/default/files/snake.tar.gz' -o /tmp/snake.tar.gz
          tar -xzf /tmp/snake.tar.gz -C /tmp
      - name: Export GLB with animation
        run: |
          cat >/tmp/export.py <<'PY'
          import bpy
          bpy.ops.wm.open_mainfile(filepath='/tmp/snake/snake.blend')
          for a in bpy.data.actions:
              print('ACTION',a.name)
          bpy.ops.export_scene.gltf(filepath='prototype/assets/opengameart-snake.glb',export_format='GLB',export_animations=True,export_apply=False)
          PY
          mkdir -p prototype/assets
          blender -b -t 2 --python /tmp/export.py
          test -s prototype/assets/opengameart-snake.glb
      - name: Commit isolated GLB
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prototype/assets/opengameart-snake.glb
          git commit -m "Add CC0 animated snake GLB for isolated test"
          git push
